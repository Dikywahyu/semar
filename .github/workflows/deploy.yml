name: Deploy to cPanel

on:
  push:
    branches:
      - main # Sesuaikan jika branch Anda bernama 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: semarunitri.com
          username: semm3712
          port: 2223
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Masuk ke folder repository di cPanel
            cd /home/semm3712/repositories/semar
            
            # 2. Menarik perubahan terbaru dari GitHub
            git pull origin main
            
            # 3. Salin semua perubahan ke folder aplikasi aktif (public_html)
            /bin/cp -rf * /home/semm3712/public_html/
            
            # 4. Masuk ke direktori aplikasi utama tempat file 'artisan' dan '.env' berada
            cd /home/semm3712/public_html/
            
            # 5. Jalankan migrasi baru secara otomatis (--force wajib untuk mode production)
            php artisan migrate --force
            
            # 6. Bersihkan cache agar perubahan kode & view langsung diterapkan
            php artisan optimize:clear